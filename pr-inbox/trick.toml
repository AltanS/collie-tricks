# PR Inbox: public replies on your own login, one Decision per draft that passes the house check.
id = "pr-inbox"
name = "PR Inbox"
description = "Open pull requests and issues that wait for you."
about = "PR Inbox lists the open pull requests and issues that wait for the owner. It shows what needs an answer now. It only shows them, and it changes nothing."
run = "program.ts"
every = "5m"
icon = "chat"
# Every place `show` in config.toml may name, and the session. Which ones draw is config.toml's call.
places = ["dashboard", "tabbar", "status", "belt", "session"]
# gh reads its login from the system keyring, which it reaches over the session bus.
env = ["DBUS_SESSION_BUS_ADDRESS"]
contract = 1
# Its Decisions name replyTo: your answer goes to that session as your own message, so Collie asks for this.
decides = "reply"
