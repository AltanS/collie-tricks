# Tag: the release gate. Seven gates, a row and a numbered chip each, and one Decision when all are green.
id = "tag"
name = "Tag"
run = "program.ts"
every = "5m"
icon = "tag"
# Every place `show` in config.toml may name, and the session. Which ones draw is config.toml's call.
places = ["dashboard", "tabbar", "status", "belt", "session"]
# gh reads its login from the system keyring, which it reaches over the session bus.
env = ["DBUS_SESSION_BUS_ADDRESS"]
contract = 1
