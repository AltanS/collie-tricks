# UI Approvals: the yes by name for UI changes. One Decision per visible change in a worktree's LOOK.md, with its shot.
id = "ui-approvals"
name = "UI Approvals"
run = "program.ts"
every = "5m"
icon = "eye"
# Every place `show` in config.toml may name, and the session. Which ones draw is config.toml's call.
places = ["dashboard", "tabbar", "status", "belt", "session"]
contract = 1
