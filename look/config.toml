# The Look trick's settings. Not part of the code hash: edit freely. Paths may be absolute or ~/..., globs allowed.
# Every matching folder that holds a LOOK.md is a branch root; its branch comes from git.
# Empty: Look finds nothing and the Session says so. Example: roots = ["~/work/*"]
roots = []
# A running copy of your app. A change whose route is a path (such as /settings/sync) gets a link to
# <lane><route> on its Decision. Empty: no link. Example: lane = "http://localhost:5173"
lane = ""
# When no session's folder is a branch root, the Decision's replyTo is the session of this exact name, if one
# is live. Empty: no replyTo, and the Session says answers are recorded here only.
reply_session = ""
# Where the count of changes waiting shows: any of "dashboard" (a tile), "tabbar" (an item in the bottom bar),
# "status" (a chip in the status line) and "belt" (a mark at the end of the Belt). [] shows only the Session.
show = ["dashboard"]
